# Slack app manifest for jev.
# Create the app at https://api.slack.com/apps -> "Create New App" -> "From a manifest".
display_information:
  name: jev
  description: its jev
  background_color: "#1f1f1f"
features:
  bot_user:
    display_name: jev
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
